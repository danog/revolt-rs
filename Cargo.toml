[package]
name = "revolt-ext"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/danog/revolt-rs"
description = "The revolt PHP extension: revolt/event-loop implemented natively in Rust"

[lib]
# the PHP extension: revolt.so
name = "revolt"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
revolt-rs = { path = "crates/revolt-rs" }

[workspace]
members = ["crates/revolt-rs", "examples/embedder"]

# CI: clippy with warnings as errors (tests.yml's lint job)
[workspace.lints.clippy]
# zpp!'s out-pointers are evaluated in its unsafe block (the callers pass `&mut local`s); an
# #[allow] on an exported macro does not reach its expansions
macro_metavars_in_unsafe = "allow"

[lints]
workspace = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = 1

# quicker builds for test iterations (target/fast/librevolt.{so,dylib})
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
